<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#141412">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Health</title>
<meta name="version" content="2.1">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Karla:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141412;--sf:#1e1d1a;--ink:#f0ede8;--ink2:#a8a498;--ink3:#5a5850;
  --accent:#c8832a;--acc-lt:#2a2218;
  --warm:#e8a040;--warm-lt:#2a2010;
  --blue:#6aabdd;--blue-lt:#1a2535;
  --purple:#9a7acb;--purple-lt:#221a35;
  --red:#cc6060;--red-lt:#2a1818;
  --gold:#d4a830;--gold-lt:#2a2410;
  --teal:#4ab8b8;--teal-lt:#152828;
  --slate:#8898aa;--slate-lt:#1a2028;
  --border:#2a2925;--r:13px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);font-family:'Karla',sans-serif;color:var(--ink);}
#app{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden;}
.view{display:none;flex-direction:column;height:100%;overflow:hidden;}
.view.active{display:flex;}
.body{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:80px;}
.body::-webkit-scrollbar{display:none;}

/* TOPBAR */
.topbar{padding:46px 22px 10px;flex-shrink:0;}
.topbar-row{display:flex;justify-content:space-between;align-items:flex-end;}
.page-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:400;color:var(--ink);letter-spacing:-.5px;line-height:1;}
.page-sub{font-size:13px;color:var(--ink3);margin-top:3px;font-weight:300;}
.icon-btn{width:32px;height:32px;background:var(--sf);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);}
.icon-btn:active{background:var(--border);}

/* SUBTABS */

/* SECTION */
.sec{padding:13px 22px 0;}
.sec-lbl{font-size:11px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--ink3);margin-bottom:8px;}

/* STATS */
.stat-row{display:flex;gap:6px;}
.stat-box{flex:1;background:var(--sf);border:1px solid var(--border);border-radius:var(--r);padding:8px 6px;text-align:center;}
.stat-val{font-family:'Playfair Display',serif;font-size:18px;color:var(--ink);line-height:1;}
.stat-lbl{font-size:9px;color:var(--ink3);margin-top:3px;}
.stat-box.accent{background:var(--accent);border-color:var(--accent);}
.stat-box.accent .stat-val,.stat-box.accent .stat-lbl{color:#fff;}
.stat-box.accent .stat-lbl{opacity:.7;}
.stat-box.green{background:var(--acc-lt);border-color:var(--accent);}
.stat-box.green .stat-val,.stat-box.green .stat-lbl{color:var(--accent);}

/* WATER */
.water-row{display:flex;gap:6px;align-items:center;padding:10px 12px;background:var(--sf);border:1px solid var(--border);border-radius:var(--r);}
.glass{flex:1;height:32px;border-radius:4px 4px 6px 6px;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;position:relative;overflow:hidden;}
.glass::after{content:'';position:absolute;bottom:0;left:0;right:0;height:0;background:linear-gradient(to top,var(--accent),var(--warm));opacity:.8;transition:height .3s ease;}
.glass.full{border-color:var(--accent);}
.glass.full::after{height:100%;}
.water-add{width:32px;height:32px;border-radius:7px;background:var(--acc-lt);border:1px solid var(--accent);color:var(--accent);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.water-add:active{background:var(--accent);color:#fff;}

/* MEAL CARD */

.check{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;font-size:11px;color:transparent;}
.check.on{background:var(--accent);border-color:var(--accent);color:#fff;}

.mac:last-child{border-right:none;}

/* WORKOUT COL */
.col-card{background:var(--sf);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.col-card-body{padding:8px;}
.mini-item{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--border);}
.mini-item:last-child{border-bottom:none;}
.mini-item.done .mini-title{text-decoration:line-through;opacity:.4;}
.mini-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.mini-title{flex:1;font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;flex-shrink:0;transition:all .2s;}
.mini-check.on{background:var(--accent);border-color:var(--accent);color:#fff;}

/* TO DO */
.todo-item{background:var(--sf);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:6px;transition:opacity .3s;}
.todo-item.done{opacity:.5;}
.todo-row{display:flex;align-items:center;gap:10px;padding:12px 14px;}
.todo-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.todo-body{flex:1;min-width:0;}
.todo-title{font-size:14px;font-weight:500;color:var(--ink);}
.todo-item.done .todo-title{text-decoration:line-through;color:var(--ink3);}
.todo-del{background:none;border:none;color:var(--ink3);font-size:14px;cursor:pointer;padding:2px 4px;flex-shrink:0;}

/* CALENDAR */
.cal-month-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 18px;}
.cal-month-title{font-family:'Playfair Display',serif;font-size:17px;color:var(--ink);}
.cal-nav-btn{background:none;border:none;font-size:16px;color:var(--ink3);cursor:pointer;padding:3px 7px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr) 26px;gap:2px;padding:0 12px;}
.cal-dow{text-align:center;font-size:9px;font-weight:600;letter-spacing:.4px;color:var(--ink3);text-transform:uppercase;padding:3px 0;}
.cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:12px;font-weight:500;color:var(--ink2);cursor:pointer;flex-direction:column;gap:1px;position:relative;overflow:hidden;}
.cal-cell.today{outline:3px solid var(--accent);outline-offset:-1px;font-weight:700;color:var(--accent);z-index:1;}
.cal-cell.active-cal{outline:2px solid var(--ink);outline-offset:-2px;color:var(--ink);font-weight:600;}
.cal-cell.today.active-cal{outline:3px solid var(--accent);outline-offset:-2px;color:var(--accent);font-weight:700;}
.cal-cell.other-month{opacity:.25;}
.cal-cell .cal-fill{position:absolute;inset:0;border-radius:7px;z-index:0;transition:background .2s;}
.cal-cell .cal-num{position:relative;z-index:1;line-height:1;}

.cal-day-events{padding:7px 14px 0;}
.cal-ev-row{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--sf);border:1px solid var(--border);border-radius:9px;margin-bottom:5px;}
.cal-ev-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.cal-ev-name{flex:1;font-size:12px;font-weight:500;color:var(--ink);}

/* ADD FAB */
.add-fab{position:absolute;bottom:86px;right:16px;width:44px;height:44px;background:var(--ink);color:#fff;border-radius:50%;border:none;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.18);z-index:40;transition:transform .2s;}
.add-fab:active{transform:scale(.92);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(26,26,24,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;padding-bottom:env(safe-area-inset-bottom,0px);}
.modal-overlay.show{opacity:1;pointer-events:all;}
.modal{background:#1a1916;border-radius:18px 18px 0 0;padding:16px 20px 36px;width:100%;max-width:430px;transform:translateY(100%);transition:transform .3s cubic-bezier(.34,1.2,.64,1);max-height:90dvh;overflow-y:auto;padding-bottom:env(keyboard-inset-height,36px);}
.modal-overlay.show .modal{transform:translateY(0);}
.modal-handle{width:32px;height:3px;background:var(--border);border-radius:2px;margin:0 auto 14px;}
.modal-title{font-family:'Playfair Display',serif;font-size:18px;color:var(--ink);margin-bottom:14px;}
.field{margin-bottom:11px;}
.field label{display:block;font-size:10px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--ink3);margin-bottom:5px;}
.field input{width:100%;background:#0e0e0c;border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-family:'Karla',sans-serif;font-size:13px;color:var(--ink);}
.field input:focus{outline:none;border-color:var(--accent);}

.modal-actions{display:flex;gap:8px;margin-top:14px;}
.btn-cancel{flex:1;padding:11px;border-radius:10px;border:1px solid var(--border);background:transparent;font-family:'Karla',sans-serif;font-size:13px;color:var(--ink2);cursor:pointer;}
.btn-save{flex:2;padding:11px;border-radius:10px;border:none;background:var(--ink);font-family:'Karla',sans-serif;font-size:13px;font-weight:600;color:#fff;cursor:pointer;}

/* TOAST */
.toast{position:absolute;top:10px;left:10px;right:10px;background:var(--ink);border-radius:11px;padding:10px 13px;display:flex;gap:8px;align-items:center;z-index:999;transform:translateY(-130%);transition:transform .35s cubic-bezier(.34,1.4,.64,1);box-shadow:0 4px 16px rgba(0,0,0,.16);}
.toast.show{transform:translateY(0);}
.t-body{flex:1;}
.t-title{font-size:12px;font-weight:600;color:#fff;}
.t-msg{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px;}
.t-x{color:rgba(255,255,255,.3);cursor:pointer;background:none;border:none;font-size:13px;padding:0;}

/* NAV */
.nav{position:absolute;bottom:0;left:0;right:0;background:rgba(20,20,18,.96);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;padding:6px 0 18px;z-index:50;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;background:none;border:none;padding:5px 0;}
.nb:active{opacity:.6;}
.ni{width:20px;height:20px;color:var(--ink3);}
.ni svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.6;}
.nl{font-size:9px;color:var(--ink3);font-weight:500;margin-top:1px;}
.nb.active .nl{color:var(--accent);font-weight:600;}
.nb.active .ni{color:var(--accent);}

/* UTILS */
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.pop{animation:pop .25s ease;}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fi{animation:fi .22s ease both;}
.empty-state{text-align:center;padding:20px 22px;color:var(--ink3);font-size:12px;}
.card-stack{display:flex;flex-direction:column;}
.action-link{background:none;border:none;font-size:11px;color:var(--ink3);cursor:pointer;text-decoration:underline;padding:0;}
.by-item{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--sf);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px;transition:opacity .2s;}
.by-item.dragging{opacity:.4;}
.by-drag{color:var(--ink3);cursor:grab;font-size:16px;flex-shrink:0;touch-action:none;user-select:none;}
.by-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.by-title{flex:1;font-size:14px;font-weight:500;color:var(--ink);}
.by-edit{background:none;border:none;color:var(--ink3);font-size:12px;cursor:pointer;padding:2px 4px;}
.by-del{background:none;border:none;color:var(--ink3);font-size:14px;cursor:pointer;padding:2px 4px;}
</style>
</head>
<body>
<div id="app">

<!-- TOAST -->
<div class="toast" id="toast">
  <div class="t-body"><div class="t-title" id="t-title"></div><div class="t-msg" id="t-msg"></div></div>
  <button class="t-x" onclick="hideToast()">✕</button>
</div>

<!-- ADD TODO MODAL -->
<div class="modal-overlay" id="todo-overlay" onclick="closeOvl('todo-overlay',event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Add item</div>
    <div class="field"><label>Title</label><input type="text" id="todo-inp" placeholder="What do you need to do?"></div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeOvl('todo-overlay')">Cancel</button>
      <button class="btn-save" onclick="saveTodo()">Add</button>
    </div>
  </div>
</div>

<!-- ══ CALENDAR ══ -->
<div class="view active" id="view-cal">
  <div class="topbar">
    <div class="topbar-row">
      <div><div class="page-title" id="cal-month-title-top">March</div><div class="page-sub" id="cal-year-sub">2026</div></div>
    </div>
  </div>
  <div class="body">
    <div class="cal-month-nav" style="padding:0 18px 6px">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
      <div id="cal-month-title" style="font-family:'Playfair Display',serif;font-size:15px;color:var(--ink3)"></div>
      <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-day-events" id="cal-day-events"></div>
  </div>
</div>

<!-- ══ TODAY ══ -->
<div class="view" id="view-today">
  <div class="topbar">
    <div class="topbar-row">
      <div><div class="page-title" id="today-title">Today</div><div class="page-sub" id="today-sub">Day 1</div></div>
      <button class="icon-btn" onclick="showView('todo')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </button>
    </div>
  </div>
  <div class="body">
    <div class="sec">
      <div class="stat-row">
        <div class="stat-box"><div class="stat-val" id="st-diet">0/7</div><div class="stat-lbl">diet</div></div>
        <div class="stat-box"><div class="stat-val" id="st-workout">0/2</div><div class="stat-lbl">workout</div></div>
        <div class="stat-box"><div class="stat-val" id="st-better">0/6</div><div class="stat-lbl">better self</div></div>
        <div class="stat-box"><div class="stat-val" id="st-todos">0</div><div class="stat-lbl">to do</div></div>
      </div>
    </div>

    <div class="sec" style="margin-top:6px">
      <div class="sec-lbl">Productive day</div>
      <div class="col-card"><div class="col-card-body" id="today-productive"></div></div>
    </div>
    <div class="sec" style="margin-top:6px">
      <div class="sec-lbl">Diet</div>
      <div class="col-card">
        <div class="col-card-body" id="today-diet-col"></div>
      </div>
    </div>
    <div class="sec" style="margin-top:6px">
      <div class="sec-lbl">Workout</div>
      <div class="col-card">
        <div class="col-card-body" id="today-workout-col"></div>
      </div>
    </div>
    <div class="sec" style="margin-top:6px">
      <div class="sec-lbl">Better yourself</div>
      <div class="col-card"><div class="col-card-body" id="today-daily-tasks"></div></div>
    </div>
    <div class="sec" style="margin-top:6px">
      <div class="sec-lbl" style="display:flex;justify-content:space-between;align-items:center">
        <span>To Do</span>
        <button onclick="showView('todo')" style="background:none;border:none;font-size:11px;color:var(--accent);cursor:pointer;font-family:'Karla',sans-serif;font-weight:600">See all</button>
      </div>
      <div id="today-todos" class="card-stack"></div>
    </div>
    <div style="padding:16px 22px 0;text-align:center">
      <button onclick="clearAllData()" class="action-link">Clear all stored data</button>
    </div>
    <div style="padding:8px 22px 16px;display:flex;gap:8px">
      <button onclick="exportData()" style="flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--sf);font-family:'Karla',sans-serif;font-size:13px;color:var(--ink2);cursor:pointer">Export data</button>
      <button onclick="importData()" style="flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--sf);font-family:'Karla',sans-serif;font-size:13px;color:var(--ink2);cursor:pointer">Import data</button>
    </div>
  </div>
</div>

<!-- ══ TO DO ══ -->
<div class="view" id="view-todo">
  <div class="topbar">
    <div class="topbar-row">
      <div><div class="page-title">To Do</div></div>
      <button class="icon-btn" onclick="openTodoModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </div>
  <div class="body">
    <div class="sec">
      <div id="todo-list" class="card-stack"></div>
    </div>
    <div style="padding:12px 22px 0;display:flex;justify-content:flex-end">
      <button onclick="clearDoneTodos()" class="action-link">Clear completed</button>
    </div>
  </div>
  <button class="add-fab" onclick="openTodoModal()">+</button>
</div>

<!-- ══ BETTER YOURSELF ══ -->
<div class="view" id="view-better">
  <div class="topbar">
    <div class="topbar-row">
      <div><div class="page-title">Better yourself</div><div class="page-sub">Daily habits</div></div>
      <button class="icon-btn" id="by-add-btn" onclick="openByModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </div>
  <div class="body">
    <div class="sec">
      <div id="by-list"></div>
    </div>
    <div style="padding:10px 22px 0;font-size:11px;color:var(--ink3);text-align:center">Hold and drag to reorder</div>
  </div>
</div>

<!-- ADD/EDIT HABIT MODAL -->
<div class="modal-overlay" id="by-overlay" onclick="closeOvl('by-overlay',event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="by-modal-title">Add habit</div>
    <div class="field"><label>Name</label><input type="text" id="by-inp" placeholder="e.g. Meditate, Cold shower…"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeOvl('by-overlay')">Cancel</button>
      <button class="btn-save" onclick="saveByItem()">Save</button>
    </div>
  </div>
</div>

<!-- NAV -->
<nav class="nav">
  <button class="nb active" id="nav-cal" onclick="showView('cal')">
    <div class="ni"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
    <div class="nl">Calendar</div>
  </button>
  <button class="nb" id="nav-today" onclick="showView('today')">
    <div class="ni"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg></div>
    <div class="nl">Today</div>
  </button>
  <button class="nb" id="nav-better" onclick="showView('better')">
    <div class="ni"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg></div>
    <div class="nl">Habits</div>
  </button>
  <button class="nb" id="nav-todo" onclick="showView('todo')">
    <div class="ni"><svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
    <div class="nl">To Do</div>
  </button>
</nav>
</div>

<script>
// ── ICONS ──────────────────────────────────────────

// ── DATE HELPERS ───────────────────────────────────
function dateStr(d){
  const x=d||new Date();
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
}
const todayStr=()=>dateStr();

function planIdx(date){
  const d=date||new Date();
  const local=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12,0,0);
  const s=new Date(START_Y,START_M,START_D,12,0,0);
  const raw=Math.floor((local-s)/86400000);
  return ((raw%14)+14)%14;
}

// ── CALENDAR ───────────────────────────────────────
function weekStarRatio(weekMonday){
  // 4 tracked items per day: eat healthy, no fizzy, cardio, weights
  // Full star at 20/28 ticks
  const TRACKED=['diet_eat_','diet_fizzy_','wo_cardio_','wo_weights_'];
  let ticks=0;
  for(let i=0;i<7;i++){
    const d=new Date(weekMonday);d.setDate(d.getDate()+i);
    const ds=dateStr(d);
    TRACKED.forEach(k=>{if(doneItems[k+ds]) ticks++;});
  }
  return Math.min(1, ticks/20);
}

function makeStarSvg(ratio,id){
  const pct=Math.round(ratio*100);
  const empty=ratio<=0;
  const full=ratio>=1;
  return `<svg viewBox="0 0 24 24" width="22" height="22">
    <defs>
      <clipPath id="sc${id}"><polygon points="12,1 14.6,8.6 22.5,8.6 16.2,13.4 18.8,21 12,16.5 5.2,21 7.8,13.4 1.5,8.6 9.4,8.6"/></clipPath>
      <linearGradient id="sg${id}" x1="0" y1="1" x2="0" y2="0">
        <stop offset="${pct}%" stop-color="#d4a830"/>
        <stop offset="${pct}%" stop-color="transparent"/>
      </linearGradient>
    </defs>
    <polygon points="12,1 14.6,8.6 22.5,8.6 16.2,13.4 18.8,21 12,16.5 5.2,21 7.8,13.4 1.5,8.6 9.4,8.6"
      fill="${empty?'none':'#1e1d1a'}" stroke="${empty?'#2a2925':'#3a3830'}" stroke-width="1.5"/>
    ${!empty?`<rect x="0" y="0" width="24" height="24" fill="url(#sg${id})" clip-path="url(#sc${id})"/>`:''}
    ${full?`<polygon points="12,1 14.6,8.6 22.5,8.6 16.2,13.4 18.8,21 12,16.5 5.2,21 7.8,13.4 1.5,8.6 9.4,8.6" fill="#d4a830"/>`:''}</svg>`;
}

function completionColour(ratio){
  if(ratio<=0) return null;
  const hue=Math.round(ratio*120);
  const sat=35+Math.round(ratio*15);
  const lit=45+Math.round(ratio*17);
  return `hsl(${hue},${sat}%,${lit}%)`;
}

function getDayCompletionRatio(date){
  const today=new Date();today.setHours(23,59,59);
  // Don't colour future days
  if(date>today) return 0;
  const ds=dateStr(date);
  const dow=date.getDay();
  const dtKeys=getTasks().map(t=>t.id+'_'+ds);
  const waterVal=gs('hp_water_'+ds,0);

  // Workout — two simple keys (cardio + weights)
  const woKeys=['wo_cardio_'+ds,'wo_weights_'+ds];

  const prodKey='productive_'+ds;
  const isProd=!!doneItems[prodKey];

  // diet: water(5) + eat(1) + fizzy(1) = 7, daily tasks + workout(2) + productive(3)
  const eatDone2=!!doneItems['diet_eat_'+ds];
  const fizzyDone2=!!doneItems['diet_fizzy_'+ds];
  const total=7 + dtKeys.length + woKeys.length + 3;
  let done=0;
  done+=Math.min(5,waterVal)+(eatDone2?1:0)+(fizzyDone2?1:0); // diet
  done+=dtKeys.filter(k=>!!doneItems[k]).length;
  done+=woKeys.filter(k=>!!doneItems[k]).length;
  done+=isProd?3:0;

  return Math.min(1, done/total);
}

function renderCalendar(){
  const d=calViewDate;
  const titleEl=document.getElementById('cal-month-title-top');
  const yearEl=document.getElementById('cal-year-sub');
  const subEl=document.getElementById('cal-month-title');
  if(titleEl) titleEl.textContent=MF[d.getMonth()];
  if(yearEl) yearEl.textContent=d.getFullYear();
  if(subEl) subEl.textContent='';
  const grid=document.getElementById('cal-grid');if(!grid)return;grid.innerHTML='';
  ['M','T','W','T','F','S','S'].forEach(x=>{const e=document.createElement('div');e.className='cal-dow';e.textContent=x;grid.appendChild(e);});
  const starHdr=document.createElement('div');starHdr.className='cal-dow';starHdr.style='color:#3a3830;font-size:10px;text-align:center;';starHdr.textContent='★';grid.appendChild(starHdr);
  const first=new Date(d.getFullYear(),d.getMonth(),1);
  let sd=first.getDay();sd=(sd+6)%7;
  const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  const dip=new Date(d.getFullYear(),d.getMonth(),0).getDate();
  const todayLocal=new Date();todayLocal.setHours(0,0,0,0);
  const selDs=dateStr(calSelDate);
  // Track position in 8-col grid (7 days + star)
  let colPos=sd; // 0=Mon...6=Sun, after sd padding cells
  let starId=0;

  // Helper: add star for the week starting on `weekMonday`
  function addStarCell(weekMonday){
    const sc=document.createElement('div');
    sc.style='display:flex;align-items:center;justify-content:center;';
    const today2=new Date();today2.setHours(0,0,0,0);
    const isFuture=weekMonday>today2;
    sc.innerHTML=isFuture?makeStarSvg(0,starId):makeStarSvg(weekStarRatio(weekMonday),starId);
    starId++;
    grid.appendChild(sc);
  }

  // Padding cells for partial first week
  for(let i=sd-1;i>=0;i--){const c=document.createElement('div');c.className='cal-cell other-month';c.innerHTML=`<span class="cal-num">${dip-i}</span>`;grid.appendChild(c);}

  // If first week is partial, we still need a star at end of row
  // sd padding cells + remaining days until Sunday
  // colPos tracks how many cells rendered in current row (0-6)

  for(let day=1;day<=dim;day++){
    const cd=new Date(d.getFullYear(),d.getMonth(),day);
    const cdStr=dateStr(cd);
    const isT=cd.getTime()===todayLocal.getTime();
    const isS=cdStr===selDs;
    const ratio=getDayCompletionRatio(cd);
    const bg=completionColour(ratio);
    const c=document.createElement('div');
    c.className='cal-cell'+(isT?' today':'')+(isS?' active-cal':'');
    const fill=bg?`<div class="cal-fill" style="background:${bg}"></div>`:'';
    const numStyle=bg?'color:var(--bg);font-weight:600;':'';
    c.innerHTML=fill+`<span class="cal-num" style="${numStyle}">${day}</span>`;
    c.addEventListener('click',(()=>{
      const dd=new Date(d.getFullYear(),d.getMonth(),day);
      return()=>{calSelDate=new Date(dd);renderCalendar();renderCalDayEvents();};
    })());
    grid.appendChild(c);
    colPos++;
    // After Sunday (colPos=7), insert star then reset
    if(colPos===7){
      // Find Monday of this week
      const sunDate=new Date(d.getFullYear(),d.getMonth(),day);
      const mon=new Date(sunDate);mon.setDate(mon.getDate()-6);
      addStarCell(mon);
      colPos=0;
    }
  }

  // Trailing padding cells
  const rem=(sd+dim)%7===0?0:7-(sd+dim)%7;
  for(let i=1;i<=rem;i++){const c=document.createElement('div');c.className='cal-cell other-month';c.innerHTML=`<span class="cal-num">${i}</span>`;grid.appendChild(c);}
  // Star for last partial week if it didn't end on Sunday
  if(rem>0){
    const lastDay=new Date(d.getFullYear(),d.getMonth(),dim);
    const mon=new Date(lastDay);mon.setDate(mon.getDate()-((lastDay.getDay()+6)%7));
    addStarCell(mon);
  }
  renderCalDayEvents();
}

    const isProd=!!doneItems[prodKey];
    prodEl.innerHTML=`<div class="mini-item${isProd?' done':''}"><div class="mini-dot" style="background:var(--gold)"></div><div class="mini-title">I was productive today</div><button class="mini-check${isProd?' on':''}" onclick="togProductive('${prodKey}',this)">${isProd?'✓':''}</button></div>`;
  }

  // Todos preview (pending only, max 3)
  const tw=document.getElementById('today-todos');tw.innerHTML='';
  const pending=todos.filter(t=>!t.done);
  if(!pending.length){
    tw.innerHTML=`<div class="empty-state" style="padding:8px 0">All done! Add more in To Do tab</div>`;
  } else {
    pending.slice(0,3).forEach(t=>{
      const card=document.createElement('div');card.className='todo-item';
      card.innerHTML=`<div class="todo-row"><div class="todo-dot" style="background:${C_DOT[t.colour]||'#999'}"></div><div class="todo-body"><div class="todo-title">${t.title}</div></div><button class="check" onclick="togTodoFromToday('${t.id}',this)"></button></div>`;
      tw.appendChild(card);
    });
    if(pending.length>3){
      const more=document.createElement('div');more.style='padding:6px 0;font-size:12px;color:var(--ink3);text-align:center;';
      more.textContent=`+${pending.length-3} more`;tw.appendChild(more);
    }
  }
}

// ── TO DO ──────────────────────────────────────────
function openTodoModal(){
  document.getElementById('todo-inp').value='';
  document.getElementById('todo-overlay').classList.add('show');
  setTimeout(()=>document.getElementById('todo-inp').focus(),300);
}

function saveTodo(){
  const title=document.getElementById('todo-inp').value.trim();
  if(!title){showToast('Add a title','');return;}
  todos.push({id:'t_'+Date.now(),title,colour:'accent',done:false,doneDate:null});
  ss('hp_todos',todos);
  closeOvl('todo-overlay');
  renderTodoList();
  renderToday();
  showToast('Added',title);
}

function togTodo(id){
  const t=todos.find(x=>x.id===id);if(!t) return;
  t.done=!t.done;
  t.doneDate=t.done?dateStr():null;
  ss('hp_todos',todos);
  renderTodoList();
  renderToday();
  if(document.querySelector('#view-cal.active')) renderCalendar();
}

function togTodoFromToday(id,btn){
  togTodo(id);
  // Update button visually
  btn.classList.add('on');btn.textContent='✓';btn.classList.add('pop');
  const card=btn.closest('.todo-item');
  if(card){card.style.transition='opacity .3s';setTimeout(()=>{card.style.opacity='0';},200);}
}

function deleteTodo(id){
  todos=todos.filter(x=>x.id!==id);
  ss('hp_todos',todos);
  renderTodoList();renderToday();
}

function clearDoneTodos(){
  if(!todos.some(t=>t.done)){showToast('None to clear','Tick items first');return;}
  if(confirm('Remove all completed items?')){
    todos=todos.filter(t=>!t.done);
    ss('hp_todos',todos);
    renderTodoList();renderToday();
    showToast('Cleared','Completed items removed');
  }
}

function renderTodoList(){
  const list=document.getElementById('todo-list');if(!list) return;
  list.innerHTML='';
  if(!todos.length){list.innerHTML=`<div class="empty-state">Nothing here yet — tap + to add</div>`;return;}
  // Pending first, then done
  [...todos.filter(t=>!t.done),...todos.filter(t=>t.done)].forEach(t=>{
    const card=document.createElement('div');card.className='todo-item fi'+(t.done?' done':'');
    card.innerHTML=`<div class="todo-row"><div class="todo-dot" style="background:${C_DOT[t.colour]||'#999'}"></div><div class="todo-body"><div class="todo-title">${t.title}</div></div><button class="check${t.done?' on':''}" onclick="togTodo('${t.id}')">${t.done?'✓':''}</button><button class="todo-del" onclick="deleteTodo('${t.id}')">✕</button></div>`;
    list.appendChild(card);
  });
}

// ── TOAST ──────────────────────────────────────────
let _tt;
function showToast(title,msg){
  document.getElementById('t-title').textContent=title;
  document.getElementById('t-msg').textContent=msg||'';
  document.getElementById('toast').classList.add('show');
  clearTimeout(_tt);_tt=setTimeout(hideToast,2800);
}
function hideToast(){document.getElementById('toast').classList.remove('show');}

// ── MODAL ──────────────────────────────────────────
function closeOvl(id,e){
  if(e&&e.target!==document.getElementById(id)) return;
  document.getElementById(id).classList.remove('show');
}

// ── EXPORT / IMPORT ────────────────────────────────
function exportData(){
  const data={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&(k.startsWith('hp_')||k.startsWith('shop_'))){
      try{data[k]=JSON.parse(localStorage.getItem(k));}catch{data[k]=localStorage.getItem(k);}
    }
  }
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='health_backup_'+dateStr()+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  showToast('Exported','Backup saved to downloads');
}

function importData(){
  const input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(confirm('Import this backup? Your current data will be replaced.')){
          Object.entries(data).forEach(([k,v])=>localStorage.setItem(k,JSON.stringify(v)));
          showToast('Imported','Data restored');
          setTimeout(()=>location.reload(),800);
        }
      } catch{showToast('Error','Invalid backup file');}
    };
    reader.readAsText(file);
  };
  input.click();
}

function clearAllData(){
  if(confirm('Clear all stored data? This resets everything.')){
    for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k)localStorage.removeItem(k);}
    showToast('Cleared','All data reset');
    setTimeout(()=>location.reload(),800);
  }
}

// ── VIEWS ──────────────────────────────────────────
// ── BETTER YOURSELF TAB ────────────────────────────
// DAILY_TASKS is the source of truth — editable at runtime via userTasks
// userTasks overrides DAILY_TASKS if set
let userTasks=gs('hp_user_tasks',null);
function getTasks(){return userTasks||DAILY_TASKS;}

let byEditId=null;
let dragSrc=null;

function openByModal(id){
  byEditId=id||null;
  document.getElementById('by-modal-title').textContent=id?'Rename habit':'Add habit';
  const task=id?getTasks().find(t=>t.id===id):null;
  document.getElementById('by-inp').value=task?task.title:'';
  document.getElementById('by-overlay').classList.add('show');
  setTimeout(()=>document.getElementById('by-inp').focus(),300);
}

function saveByItem(){
  const title=document.getElementById('by-inp').value.trim();
  if(!title){showToast('Add a name','');return;}
  let tasks=[...getTasks()];
  if(byEditId){
    const i=tasks.findIndex(t=>t.id===byEditId);
    if(i>-1) tasks[i]={...tasks[i],title};
  } else {
    const colours=['blue','warm','purple','accent','teal','gold','red','slate'];
    const colour=colours[tasks.length%colours.length];
    tasks.push({id:'dt-'+Date.now(),title,colour});
  }
  userTasks=tasks;ss('hp_user_tasks',userTasks);
  closeOvl('by-overlay');
  renderByList();renderToday();
  showToast(byEditId?'Renamed':'Added',title);
}

function deleteByItem(id){
  if(!confirm('Remove this habit?')) return;
  userTasks=getTasks().filter(t=>t.id!==id);
  ss('hp_user_tasks',userTasks);
  renderByList();renderToday();
  showToast('Removed','');
}

function renderByList(){
  const list=document.getElementById('by-list');if(!list)return;
  list.innerHTML='';
  const tasks=getTasks();
  tasks.forEach((t,i)=>{
    const item=document.createElement('div');
    item.className='by-item';
    item.draggable=true;
    item.dataset.id=t.id;
    item.innerHTML=`<span class="by-drag">⠿</span><div class="by-dot" style="background:${C_DOT[t.colour]||'var(--ink3)'}"></div><div class="by-title">${t.title}</div><button class="by-edit" onclick="openByModal('${t.id}')">✎</button><button class="by-del" onclick="deleteByItem('${t.id}')">✕</button>`;
    // Drag events
    item.addEventListener('dragstart',e=>{dragSrc=t.id;item.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    item.addEventListener('dragend',()=>item.classList.remove('dragging'));
    item.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';});
    item.addEventListener('drop',e=>{
      e.preventDefault();
      if(dragSrc===t.id) return;
      const tasks2=[...getTasks()];
      const fromIdx=tasks2.findIndex(x=>x.id===dragSrc);
      const toIdx=tasks2.findIndex(x=>x.id===t.id);
      const [moved]=tasks2.splice(fromIdx,1);
      tasks2.splice(toIdx,0,moved);
      userTasks=tasks2;ss('hp_user_tasks',userTasks);
      renderByList();renderToday();
    });
    list.appendChild(item);
  });
}

function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  if(name==='cal') renderCalendar();
  else if(name==='today'){viewingDate=null;renderToday();}
  else if(name==='better') renderByList();
  else if(name==='todo') renderTodoList();
}
